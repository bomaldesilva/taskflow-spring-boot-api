services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: ${DB_USERNAME:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10


  taskflow-api:
    build: .

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/taskflow
      DB_USERNAME: ${DB_USERNAME:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a generated base64 key in .env or your environment}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      JWT_ISSUER: ${JWT_ISSUER:-taskflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-taskflow-api}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30}

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
