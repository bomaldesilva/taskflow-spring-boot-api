spring.application.name=taskflow

server.port=8080

app.name=TaskFlow
app.version=1.0
spring.profiles.default=dev

security.jwt.issuer=${JWT_ISSUER:taskflow}
security.jwt.audience=${JWT_AUDIENCE:taskflow-api}
security.jwt.expiration=${JWT_EXPIRATION:900}
security.jwt.clock-skew=${JWT_CLOCK_SKEW:30}
